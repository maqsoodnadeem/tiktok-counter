<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Agent</title>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: #0f0f12; 
      color: #fff; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      padding: 20px; 
      min-height: 100vh;
      margin: 0;
    }
    h2 { color: #fe2c55; margin-bottom: 20px; }
    .chat-box { 
      width: 100%; 
      max-width: 400px; 
      background: #181820; 
      border-radius: 12px; 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    input { 
      padding: 12px; 
      border-radius: 8px; 
      border: 1px solid #333; 
      background: #22222d; 
      color: #fff; 
      width: 100%; 
      box-sizing: border-box;
      font-size: 16px;
    }
    button { 
      padding: 12px; 
      border-radius: 8px; 
      border: none; 
      background: #fe2c55; 
      color: #fff; 
      font-weight: bold; 
      cursor: pointer; 
      font-size: 16px;
      transition: background 0.3s;
    }
    button:hover { background: #d92345; }
    .response { 
      background: #22222d; 
      padding: 12px; 
      border-radius: 8px; 
      margin-top: 10px; 
      white-space: pre-wrap; 
      min-height: 50px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h2>My AI Agent 🤖</h2>
  <div class="chat-box">
    <input type="text" id="userInput" placeholder="Ask me anything..." />
    <button onclick="askAI()">Send</button>
    <div class="response" id="responseBox">Hello! I am your AI agent. Ask me something.</div>
  </div>

  <script>
    // یہاں اپنی چابی ڈالیں (لیکن GitHub پر نہ لکھیں)
    const API_KEY = ""; 

    async function askAI() {
      const input = document.getElementById('userInput').value;
      const responseBox = document.getElementById('responseBox');
      
      if (!input.trim()) return;
      
      if (!API_KEY) {
        responseBox.innerText = "Error: Please add your API Key in the code.";
        return;
      }

      responseBox.innerText = "Thinking...";

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: input }] }]
          })
        });
        const data = await res.json();
        
        if(data.candidates && data.candidates.length > 0) {
          const reply = data.candidates[0].content.parts[0].text;
          responseBox.innerText = reply;
        } else {
          responseBox.innerText = "Error: No response from AI.";
        }
      } catch (error) {
        responseBox.innerText = "Error: Something went wrong. Please check your internet.";
      }
    }
  </script>
</body>
</html>
