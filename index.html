<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Live Followers Counter & Tracker</title>
  
  <meta name="description" content="Free Real-Time TikTok Live Follower Counter & Stats Tracker">
  <meta name="theme-color" content="#fe2c55">

  <!-- یہاں آپ Adsterra کا کوڈ لگائیں گے -->
  <!-- ADSTERRA CODE HERE -->

  <style>
    :root {
      --primary: #fe2c55;
      --secondary: #25f4ee;
      --dark: #0f0f12;
      --card-bg: #181820;
      --box-bg: #22222d;
      --text: #ffffff;
      --subtext: #9e9ea7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--dark); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 16px; }
    
    .header { text-align: center; margin-top: 10px; margin-bottom: 14px; }
    .header h1 { font-size: 26px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .header h1 span { background: linear-gradient(45deg, var(--secondary), var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    /* اشتہار کی جگہ (Ad Placeholder) */
    .ad-container {
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,0.03);
      border: 1px dashed #333;
      border-radius: 12px;
      padding: 8px;
      margin-bottom: 14px;
      text-align: center;
      font-size: 11px;
      color: #777;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-box { width: 100%; max-width: 420px; display: flex; gap: 8px; margin-bottom: 16px; }
    .search-box input { flex: 1; padding: 12px 16px; border-radius: 25px; border: 1px solid #333; background: var(--card-bg); color: #fff; font-size: 15px; outline: none; }
    .search-box button { background: var(--primary); color: white; border: none; padding: 12px 22px; border-radius: 25px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .search-box button:active { transform: scale(0.96); }

    .card { width: 100%; max-width: 420px; background: var(--card-bg); border-radius: 24px; padding: 24px 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid #282832; }
    .avatar { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary); margin-bottom: 10px; background-color: #333; box-shadow: 0 0 15px rgba(254, 44, 85, 0.4); }
    .profile-name { font-size: 20px; font-weight: bold; margin-bottom: 2px; }
    .profile-handle { color: var(--subtext); font-size: 14px; margin-bottom: 18px; }
    
    .counter-hero { background: var(--box-bg); padding: 20px 16px; border-radius: 18px; margin-bottom: 16px; border: 1px solid #2c2c38; }
    .counter-title { font-size: 12px; font-weight: bold; color: var(--subtext); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .counter-value { font-size: 52px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
    
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .stat-box { background: var(--box-bg); padding: 14px; border-radius: 14px; border: 1px solid #2c2c38; }
    .stat-box .num { font-size: 20px; font-weight: bold; color: var(--secondary); }
    .stat-box .label { font-size: 11px; color: var(--subtext); text-transform: uppercase; margin-top: 4px; }
    
    .status-bar { font-size: 12px; color: #4ade80; display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 14px; }
    .status-dot { height: 8px; width: 8px; background-color: #4ade80; border-radius: 50%; display: inline-block; animation: blink 1.5s infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    .btn-action {
      width: 100%;
      background: #25D366;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 10px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    
    .error-msg { color: #ff4d4d; font-size: 13px; margin-top: 10px; display: none; }
  </style>
</head>
<body>

  <div class="header">
    <h1><span>TikTok</span> Live Counter</h1>
  </div>

  <!-- اوپر والا اشتہار (Adsterra Banner) -->
  <div class="ad-container">
    Sponsored Ad
  </div>

  <div class="search-box">
    <input type="text" id="usernameInput" placeholder="Enter TikTok username" value="ethan_henry3" onkeydown="if(event.key==='Enter') fetchStats()" />
    <button id="searchBtn" onclick="fetchStats()">Search</button>
  </div>

  <div class="card">
    <img src="" id="avatarImg" class="avatar" alt="Avatar" onerror="this.src='https://ui-avatars.com/api/?name=User&background=22222d&color=fff'">
    <div class="profile-name" id="displayName">Ethan Henry</div>
    <div class="profile-handle" id="userHandle">@ethan_henry3</div>
    
    <div class="counter-hero">
      <div class="counter-title">Live Followers</div>
      <div class="counter-value" id="followersCount">0</div>
    </div>
    
    <div class="stats-grid">
      <div class="stat-box">
        <div class="num" id="likesCount">0</div>
        <div class="label">Total Likes</div>
      </div>
      <div class="stat-box">
        <div class="num" id="followingCount">0</div>
        <div class="label">Following</div>
      </div>
    </div>
    
    <div class="status-bar" id="statusBar">
      <span class="status-dot"></span> Live auto-refresh active
    </div>

    <button class="btn-action" onclick="onShareClick()">
      📲 Share Profile & Live Stats
    </button>

    <div class="error-msg" id="errorMsg">Account not found or network error.</div>
  </div>

  <!-- نیچے والا اشتہار (Adsterra Banner) -->
  <div class="ad-container" style="margin-top: 16px;">
    Advertisement
  </div>

  <script>
    let intervalId = null;

    function onShareClick() {
      const shareText = "Check your live TikTok followers & statistics in real-time here: " + window.location.href;
      window.open("https://api.whatsapp.com/send?text=" + encodeURIComponent(shareText), "_blank");
    }

    async function fetchStats() {
      const searchBtn = document.getElementById('searchBtn');
      const errorMsg = document.getElementById('errorMsg');
      const statusBar = document.getElementById('statusBar');

      let u = document.getElementById('usernameInput').value.trim().replace(/^@/, '');
      if(!u) return;

      searchBtn.innerText = "Tracking...";

      try {
        let res = await fetch(`https://countik.com/api/exist/${encodeURIComponent(u)}`);
        let data = await res.json();
        
        if(data && data.status === "success") {
          document.getElementById('displayName').innerText = data.nickname || u;
          document.getElementById('userHandle').innerText = '@' + u;
          document.getElementById('followersCount').innerText = Number(data.followerCount || 0).toLocaleString();
          document.getElementById('likesCount').innerText = Number(data.heartCount || 0).toLocaleString();
          document.getElementById('followingCount').innerText = Number(data.followingCount || 0).toLocaleString();
          
          if(data.avatarThumb) {
            document.getElementById('avatarImg').src = data.avatarThumb;
          }
          
          statusBar.style.display = "flex";
          errorMsg.style.display = "none";
          
          if(!intervalId) {
            intervalId = setInterval(silentFetch, 4000);
          }
        } else {
          errorMsg.style.display = "block";
        }
      } catch(e) {
        errorMsg.style.display = "block";
      } finally {
        searchBtn.innerText = "Search";
      }
    }

    async function silentFetch() {
      let u = document.getElementById('usernameInput').value.trim().replace(/^@/, '');
      if(!u) return;

      try {
        let res = await fetch(`https://countik.com/api/exist/${encodeURIComponent(u)}`);
        let data = await res.json();
        if(data && data.status === "success") {
          document.getElementById('followersCount').innerText = Number(data.followerCount || 0).toLocaleString();
          document.getElementById('likesCount').innerText = Number(data.heartCount || 0).toLocaleString();
          document.getElementById('followingCount').innerText = Number(data.followingCount || 0).toLocaleString();
        }
      } catch(e) {}
    }

    window.onload = () => {
      fetchStats();
    };
  </script>
</body>
</html>
